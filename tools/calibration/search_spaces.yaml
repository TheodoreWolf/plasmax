tglfnn_nr:
  scope: conventional_global
  physical_from: tglfnn
  solver_only: true
  max_physical_groups: 0
  numerical:
    solver.n_max_iterations: [100, 150, 200, 300, 500]
    solver.tau_min: [1.0e-6, 1.0e-7, 1.0e-8, 1.0e-9, 1.0e-10]
    stepping.max_solver_substeps: [32, 48, 64, 96, 128]

