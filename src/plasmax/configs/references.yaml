    - torax.pedestal.T_e_ped
    - torax.pedestal.n_e_ped
    - torax.pedestal.n_e_ped_is_fGW
    - torax.pedestal.rho_norm_ped_top
    - torax.sources.generic_current
    - torax.sources.generic_particle
    - torax.sources.gas_puff
    - torax.sources.generic_heat
    - actuators
    projections:
    - source_component: TORAX v1.4.2 generic_heat
      torax_component: torax.sources.generic_heat + torax.sources.ecrh
      matched_quantities: [integrated_power, complete_radial_shape, electron_ion_partition]
      source_targets:
        power_W: 51000000.0
        gaussian_location: 0.12741589640723575
        gaussian_width: 0.07280908366127758
        electron_heat_fraction: 0.68
      torax_parameters:
        generic_heat_P_total_W: 23314285.714285713
        generic_heat_electron_fraction: 0.3
        ecrh_P_total_W: 27685714.285714287
        shared_gaussian_location: 0.12741589640723575
        shared_gaussian_width: 0.07280908366127758
      notes:
      - Both projected channels use the identical upstream Gaussian, so their sum reproduces the complete released source shape rather than only its first two moments.
    targets:
      Ip_A: 10500000.0
      f_GW: 0.8
      auxiliary_power_W: 51000000.0
      electron_heat_fraction: 0.68

