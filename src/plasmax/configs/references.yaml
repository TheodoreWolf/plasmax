references:
  iter_baseline_hot_450s:
    machine: iter
    scenario: baseline
    anchor: hot
    kind: exact
    confidence: high
    sources:
    - title: ITPA TC-33 ITER 15 MA reference state at 450 s
      url: https://zenodo.org/records/21391776/files/ITPA-TC33-450s.nc?download=1
      doi: 10.5281/zenodo.21391776
      revision: 450 s state; IMAS DD 3.42.0
      sha256: ec73a0c64afa0352a5dc8173187a03682c27b8bf8f7b5cc3f6bfba533b1fbf71
      license: redistribution terms not stated in the record
      redistribution: checksum_only
    - title: ITPA TC-33 ITER 15 MA comparison state at 415 s
      url: https://zenodo.org/records/21391776/files/ITPA-TC33-415s.nc?download=1
      doi: 10.5281/zenodo.21391776
      revision: rejected comparison state; q_min approximately 0.73
      sha256: f5e137d96ceee28085338324c5ba43be69fbe0b5a295ae069028308d2f7e121e
      license: redistribution terms not stated in the record
      redistribution: checksum_only
    extraction:
      method: imas_import
      grid: 25 TORAX cell centres at rho_tor_norm=0.02:0.04:0.98
      notes:
      - Profiles are linearly interpolated in rho_tor_norm; their cylindrical volume-weighted integral error is below 1%.
      - Psi is shifted by the released magnetic-axis value before interpolation.
      - The equilibrium is explicitly converted from IMAS DD3 COCOS 17 to a deterministic COCOS-7 GEQDSK.
      - The 450 s state is selected because q_min=0.9655; the 415 s state has q_min approximately 0.73.
    profile_sha256: cd6d237860306adffcbeef54594c5c01f20a9518672850b822daaf9b1f7594ee
    artifacts:
      data/references/iter_baseline_450s_profiles_25.csv: 2447bf4a5e773a4df9cccf4cd2128b9cff2626f7bfa3dca8f7c84fbe070fb7b2
      data/references/iter_baseline_450s.eqdsk: 4b37fc63cdcabadc9557acd2eb81ee5d018c3b04722f8ea767ca06f13e8ea800
    locked_paths:
    - torax.profile_conditions.Ip
    - torax.profile_conditions.T_i
    - torax.profile_conditions.T_e
    - torax.profile_conditions.n_e
    - torax.profile_conditions.psi
    - torax.profile_conditions.T_i_right_bc
    - torax.profile_conditions.T_e_right_bc
    - torax.profile_conditions.n_e_right_bc
    - torax.geometry.geometry_file
    - torax.sources.generic_heat
    - torax.sources.ecrh
    - torax.sources.generic_particle
    - torax.sources.pellet
    - actuators
    projections:
    - source_component: ITPA core_sources/nbi total heat
      torax_component: torax.sources.generic_heat
      matched_quantities: [integrated_power, volume_weighted_centroid, rms_width, electron_ion_partition]
      source_targets:
        power_W: 32204566.10558545
        rho_centroid: 0.5048100773961027
        rho_rms_width: 0.21657692524735792
        electron_heat_fraction: 0.6349488250037933
      torax_parameters:
        P_total: 32204566.10558545
        gaussian_location: 0.2556776403728281
        gaussian_width: 0.3334149540677585
        electron_heat_fraction: 0.6349488250037933
      notes:
      - Gaussian parameters are fitted on the converted 25-cell ITPA geometry; they are not themselves the physical centroid and width.
    - source_component: ITPA core_sources/ec electron heat
      torax_component: torax.sources.ecrh
      matched_quantities: [integrated_power, volume_weighted_centroid, rms_width, electron_ion_partition]
      source_targets:
        power_W: 16875121.09102656
        rho_centroid: 0.21154895623267286
        rho_rms_width: 0.0674905480965164
        electron_heat_fraction: 1.0
      torax_parameters:
        P_total: 16875121.09102656
        gaussian_location: 0.18092074381061005
        gaussian_width: 0.07447085458047044
      notes:
      - The local EC current-drive efficiency is not supplied by this profile projection and remains an editable local parameter.
    - source_component: ITPA core_sources/nbi ion particles
      torax_component: torax.sources.generic_particle
      matched_quantities: [integrated_particles, volume_weighted_centroid, rms_width]
      source_targets:
        particles_per_s: 1.958196187096854e+20
        rho_centroid: 0.5001969452749675
        rho_rms_width: 0.2194036058345459
      torax_parameters:
        S_total: 1.958196187096854e+20
        deposition_location: 0.2129021131867942
        particle_width: 0.3524989016656593
    - source_component: ITPA core_sources/pellet ion particles
      torax_component: torax.sources.pellet
      matched_quantities: [integrated_particles, volume_weighted_centroid, rms_width]
      source_targets:
        particles_per_s: 3.2822178577250456e+22
        rho_centroid: 0.8419126869793957
        rho_rms_width: 0.06735942621600581
      torax_parameters:
        S_total: 3.2822178577250456e+22
        pellet_deposition_location: 0.8413844189838808
        pellet_width: 0.07053089225185659
    targets:
      source_time_s: 450.0
      Ip_A: 15000000.0
      q_min: 0.9655333353712965
      auxiliary_power_W: 49079687.196612
      fusion_power_total_W: 705823585.1070224

