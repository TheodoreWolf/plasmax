        power_W: 34000000.0
      torax_parameters:
        generic_heat_P_total_W: 34000000.0
        generic_current_fraction_of_total_current: 1.0
      notes:
      - Slide 25 does not publish a deposition curve; the existing local Gaussian shape and non-inductive-current split remain editable within physical plausibility.
    - source_component: published 34 MW lower-hybrid current drive
      torax_component: torax.sources.ecrh
      matched_quantities: [integrated_power]
      source_targets:
        power_W: 34000000.0
      torax_parameters:
        P_total_W: 34000000.0
      notes:
      - TORAX exposes no lower-hybrid source in this task, so the electron-heating channel is represented by ecrh; the local deposition and current-efficiency parameters are explicitly not source-locked.
    targets:
