      q95: 5.3
      edge_poloidal_flux_Wb: 42.0772
      H98: 1.3
      beta_N: 2.56
      lower_hybrid_power_W: 34000000.0
      neutral_beam_power_W: 34000000.0
      fusion_power_W: 340000000.0

