    - torax.profile_conditions.n_e
    - torax.profile_conditions.psi
    - torax.sources.generic_current
    - torax.sources.generic_heat
    - torax.sources.ecrh
    - actuators
    projections:
    - source_component: published 34 MW neutral-beam current drive
      torax_component: torax.sources.generic_heat + torax.sources.generic_current
      matched_quantities: [integrated_power]
