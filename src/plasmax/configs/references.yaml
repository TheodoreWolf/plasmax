      license: redistribution terms not stated on the deck
      redistribution: checksum_only
    extraction:
      method: figure_digitization
      grid: 25 TORAX cell centres at rho=0.02:0.04:0.98
      page: 25
      crop: [1320, 420, 1970, 1460]
      digitization_tolerance_pixels: 2.0
      axis_transform:
        rho_pixels: [1334.0, 1948.0]
        rho_values: [0.0, 1.0]
        temperature_pixels: [881.0, 444.0]
        temperature_keV: [0.0, 30.0]
        density_pixels: [881.0, 444.0]
        density_1e20_m-3: [0.0, 1.0]
        q_pixels: [1448.0, 1040.0]
        q_values: [0.0, 10.0]
      notes:
      - Curves are illustrative; the stored CSV and generated overlay are the inspection record.
      - Psi is reconstructed from digitized q by integrating rho/q and normalized to the local 9 MA equilibrium edge flux.
    profile_sha256: 089ee22d9c40a23efb033b06e8dd7f3890915094a43b5f17026ae3930354c102
    artifacts:
      data/references/iter_advanced_slide25_profiles_25.csv: 926b24067bf00fd98e6197f0585a75819b1435535cd0f13608080c1c2f6e4484
