      method: torax_config
      grid: TORAX v1.4.2 analytic profiles evaluated by TORAX
      notes:
      - Upstream profiles, composition, pedestal targets, current fraction, source totals, and schedules are locked.
      - Controller dynamics retain the prescribed pedestal targets but enforce them through adaptive transport rather than hidden sources/sinks.
    profile_sha256: b991a79d06af13c7fb8b7b739a3e92a023a437ee421c4dbf88e2d096d6b62bd4
