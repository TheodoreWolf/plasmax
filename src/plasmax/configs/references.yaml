  iter_hybrid_hot_v1_4_2:
    machine: iter
    scenario: hybrid
    anchor: hot
    kind: upstream
    confidence: high
    sources:
    - title: TORAX ITER hybrid predictor-corrector example
      url: https://github.com/google-deepmind/torax/blob/v1.4.2/torax/examples/iterhybrid_predictor_corrector.py
