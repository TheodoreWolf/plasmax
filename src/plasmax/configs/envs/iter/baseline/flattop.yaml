# ITER baseline — flat-top phase at the ITPA TC-33 450 s reference.
#
# Episode begins already in the flat-top burn: Ip held at 15 MA, plasma starts
# hot (H-mode initial profiles). See base.yaml for the physics-gap caveats.
#
# Geometry:  Converted ITPA TC-33 450 s COCOS-7 EQDSK. Episode:
#            t_final = 200 s → 2000 steps (flat-top duration, 60–260 s).

phase: flattop
reset_reference: iter_baseline_hot_450s

initialization: ${DATA_DIR}/initializations/iter/baseline/hot.yaml

task:
  reward: P_diff
  # Intentionally uncalibrated; flat-top termination currently has no penalty.
  terminal_penalty: 0.0

torax:
  profile_conditions:
    Ip: 15.0e+6                  # constant flat-top plasma current [A]
    T_i_right_bc: 0.855          # imported rho=1 value [keV]
    T_e_right_bc: 0.62
    n_e_right_bc: 5.72e+19
  numerics:
    t_final: 200.0               # flat-top duration [s] → 2000 steps
  geometry:
    geometry_file: references/iter_baseline_450s.eqdsk
  sources:
    generic_heat:
      P_total: 5.1e+7
    ecrh:
      P_total: 0.0
      gaussian_location: 0.1274
    gas_puff:
      S_total: 1.0e+20
# Cross-scenario actuator transfer from the advanced ablation, retaining the
# baseline reset profiles, geometry, current drive, and particle sources.
# The pedestal is enforced through adaptive transport rather than a hidden
# source, so this is an operating point rather than a claim of source-clamped
# steady state. Keep reset-source values aligned with actuator initial values.
actuators:
- {name: P_nbi, low: 0.0, high: 5.1e+7, max_delta: 2.0e+6, init: 5.1e+7}
- {name: P_eccd, low: 0.0, high: 5.0e+7, max_delta: 2.0e+6, init: 0.0}
- {name: rho_eccd, low: 0.0, high: 0.8, max_delta: 0.05, init: 0.1274}
- {name: gas_puff_rate, low: 0.0, high: 1e+22, max_delta: 2e+20, init: 1.0e+20}
