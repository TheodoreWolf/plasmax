    n_e:
      0.0: {0.02: 1.1670714e+20, 0.06: 1.1667727e+20, 0.1: 1.165019e+20, 0.14: 1.1617598e+20, 0.18: 1.157678e+20, 0.22: 1.1545218e+20, 0.26: 1.1581921e+20, 0.3: 1.169548e+20, 0.34: 1.1686385e+20, 0.38: 1.1627821e+20, 0.42: 1.1481396e+20, 0.46: 1.1390974e+20, 0.5: 1.1331053e+20, 0.54: 1.1202327e+20, 0.58: 1.1036128e+20, 0.62: 1.0792315e+20, 0.66: 1.0566582e+20, 0.7: 1.0351864e+20, 0.74: 1.0090941e+20, 0.78: 9.7559282e+19, 0.82: 9.3301709e+19, 0.86: 8.8276338e+19, 0.9: 8.2672523e+19, 0.94: 7.4735285e+19, 0.98: 6.3124835e+19}
