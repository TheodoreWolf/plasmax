# ITER baseline scenario — phase-shared physics.
#
# Target: 15 MA Q=10 inductive H-mode (the ITER reference baseline). Physics
# common to all three baseline phases; each phase file overlays its deltas (Ip
# schedule, boundary conditions, initialization reference, t_final, geometry).
# Device-level config is inherited from tokamaks/iter.yaml via `tokamak: iter`.
#
# T_i, T_e, n_e, psi, and global targets are imported from the ITPA TC-33
# 450 s IMAS state. The source netCDF is checksum-only; the compact 25-cell
# source extraction is preserved under data/references/; resolved starting
# profiles live under data/initializations/iter/baseline/. The local EQDSK is
# a declared geometry projection; imported psi fixes the magnetic reset state.

tokamak: iter
scenario: baseline

stepping:
  max_event_substeps: 1

torax:
  plasma_composition:
    Z_eff: 1.7
  profile_conditions:
    n_e_right_bc_is_fGW: false
  sources:
    generic_particle:
      # ITPA NBI particle source, projected by total, dV-weighted centroid,
      # and RMS width. The Gaussian parameters below differ from those two
      # physical moments because TORAX normalizes against the shaped dV/drho.
      S_total: 1.958e+20
      deposition_location: 0.2129
      particle_width: 0.3525
    gas_puff:
      puff_decay_length: 0.3
      S_total: 0.0
    generic_heat:
      # ITPA NBI heat source, projected by power, dV-weighted moments, and
      # electron/ion partition. These Gaussian parameters reproduce a physical
      # centroid of 0.5048 and RMS width of 0.2166 on the ITPA geometry.
      gaussian_location: 0.2557
      gaussian_width: 0.3334
      P_total: 3.22e+7
      electron_heat_fraction: 0.6349
    generic_current:               # predominantly inductive — constant low CD
      fraction_of_total_current: 0.15
      gaussian_location: 0.4
      gaussian_width: 0.075
    ecrh:
      # ITPA EC source, projected by power and dV-weighted moments.
      gaussian_location: 0.1809
      gaussian_width: 0.07447
      P_total: 1.688e+7
      current_drive_efficiency: 0.3
    # pellet:
    #   S_total: 3.282e+22
    #   pellet_deposition_location: 0.8414
    #   pellet_width: 0.07053
    fusion: {}
    ei_exchange:
      Qei_multiplier: 1.0
  pedestal:
    T_i_ped: 4.727
    T_e_ped: 4.556
    n_e_ped: 7.474e+19
    n_e_ped_is_fGW: false
    rho_norm_ped_top: 0.94
  geometry:
    # Smallest contour contraction that closes every surface in the released
    # 71x71 ITPA equilibrium when TORAX constructs its geometry.
    last_surface_factor: 0.989
  # The short crash is an internal event; the environment then completes the
  # remainder of the physical control interval with the action held constant.
  mhd:
    sawtooth:
      trigger_model:
        model_name: simple
        s_critical: 0.1
        minimum_radius: 0.05
      redistribution_model:
        model_name: simple
        flattening_factor: 1.01
        mixing_radius_multiplier: 1.1
      crash_step_duration: 1.0e-5
