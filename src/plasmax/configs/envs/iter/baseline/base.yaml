  pedestal:
    T_i_ped: 4.7268568
    T_e_ped: 4.5562782
    n_e_ped: 7.4735285e+19
    n_e_ped_is_fGW: false
    rho_norm_ped_top: 0.94
  geometry:
    # Smallest contour contraction that closes every surface in the released
    # 71x71 ITPA equilibrium when TORAX constructs its geometry.
    last_surface_factor: 0.989
  # The short crash is an internal event; the environment then completes the
  # remainder of the physical control interval with the action held constant.
  mhd:
    sawtooth:
      trigger_model:
        model_name: simple
        s_critical: 0.1
        minimum_radius: 0.05
      redistribution_model:
        model_name: simple
        flattening_factor: 1.01
        mixing_radius_multiplier: 1.1
      crash_step_duration: 1.0e-5
