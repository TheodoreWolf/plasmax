# ITER baseline scenario — phase-shared hot physical reference.
#
# Target: 15 MA Q=10 inductive H-mode (the ITER reference baseline). Physics
# common to all three baseline phases; each phase file overlays its deltas (Ip
# schedule, initial/boundary profiles, t_final, geometry). Device-level config
# is inherited from tokamaks/iter.yaml via `tokamak: iter`.
#
# T_i, T_e, n_e, psi, and global targets are imported from the ITPA TC-33
# 450 s IMAS state. The source netCDF is checksum-only; the compact 25-cell
# extraction is packaged under data/references/. The local EQDSK is a declared
# geometry projection, while the imported psi fixes the magnetic reset state.

tokamak: iter
scenario: baseline

stepping:
  max_event_substeps: 1

torax:
  plasma_composition:
    Z_eff: 1.7
  profile_conditions:
    T_i:
      0.0: {0.02: 23.653497, 0.06: 23.388408, 0.1: 22.347649, 0.14: 20.898527, 0.18: 19.538816, 0.22: 18.23018, 0.26: 16.984169, 0.3: 15.919526, 0.34: 14.958622, 0.38: 14.060014, 0.42: 13.254228, 0.46: 12.512113, 0.5: 11.827781, 0.54: 11.192074, 0.58: 10.561998, 0.62: 9.9196309, 0.66: 9.2543617, 0.7: 8.5791608, 0.74: 7.9086662, 0.78: 7.2766289, 0.82: 6.6737938, 0.86: 6.1108585, 0.9: 5.5741655, 0.94: 4.7268568, 0.98: 2.2721915}
