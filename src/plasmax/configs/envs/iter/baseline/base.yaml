    normalize_n_e_to_nbar: false
    n_e_nbar_is_fGW: false
    n_e_right_bc_is_fGW: false
  sources:
    generic_particle:
      # ITPA NBI particle source, projected by total, dV-weighted centroid,
      # and RMS width. The Gaussian parameters below differ from those two
      # physical moments because TORAX normalizes against the shaped dV/drho.
      S_total: 1.958196187096854e+20
      deposition_location: 0.2129021131867942
      particle_width: 0.3524989016656593
    gas_puff:
      puff_decay_length: 0.3
      S_total: 0.0
    generic_heat:
      # ITPA NBI heat source, projected by power, dV-weighted moments, and
      # electron/ion partition. These Gaussian parameters reproduce a physical
      # centroid of 0.504810 and RMS width of 0.216577 on the ITPA geometry.
      gaussian_location: 0.2556776403728281
      gaussian_width: 0.3334149540677585
      P_total: 32204566.10558545
      electron_heat_fraction: 0.6349488250037933
    generic_current:               # predominantly inductive — constant low CD
      fraction_of_total_current: 0.15
      gaussian_location: 0.4
      gaussian_width: 0.075
    ecrh:
      # ITPA EC source, projected by power and dV-weighted moments.
      gaussian_location: 0.18092074381061005
      gaussian_width: 0.07447085458047044
      P_total: 16875121.09102656
      current_drive_efficiency: 0.3
    pellet:
