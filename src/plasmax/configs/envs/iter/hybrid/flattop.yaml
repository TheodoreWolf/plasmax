# ITER hybrid — flat-top phase.
#
# The episode begins already in the flat-top burn: Ip held at 10.5 MA and the
# plasma starts hot (H-mode initial profiles), so the agent only ever sees the
# stationary flat-top control problem. Initial conditions follow TORAX's
# iterhybrid_predictor_corrector.py example (hot 15 keV core, nbar=0.8 fGW,
# generic_current fraction 0.46).
#
# Geometry:  Static 10.5 MA EQDSK, rescaled to the live Ip. No ramp
#            interpolation. Episode: exact upstream t_final = 5 s.

phase: flattop
reset_reference: iter_hybrid_hot_v1_4_2

task:
  reward: P_diff
  # Intentionally uncalibrated; flat-top termination currently has no penalty.
  terminal_penalty: 0.0

torax:
  profile_conditions:
    Ip: 10.5e+6                  # constant flat-top plasma current [A]
    T_i_right_bc: 0.2            # edge T_i BC [keV]
    T_e_right_bc: 0.2
    n_e_right_bc: 2.5e+19        # exact TORAX v1.4.2 boundary [m^-3]
  numerics:
    t_final: 5.0
    resistivity_multiplier: 200.0
  geometry:
    geometry_file: iter_hybrid_ip105.eqdsk
  sources:
    generic_current:
      fraction_of_total_current: 0.46  # flat-top hybrid fraction (constant)
    generic_heat:
      P_total: 23314285.714285713
    ecrh:
      P_total: 27685714.285714287
      gaussian_location: 0.12741589640723575
    gas_puff:
      S_total: 6.0e+21
actuators:
- {name: P_nbi, low: 0.0, high: 50000000.0, max_delta: 2000000.0, init: 23314285.714285713}
- {name: P_eccd, low: 0.0, high: 50000000.0, max_delta: 2000000.0, init: 27685714.285714287}
- {name: rho_eccd, low: 0.0, high: 0.8, max_delta: 0.05, init: 0.12741589640723575}
- {name: gas_puff_rate, low: 1e+20, high: 1e+22, max_delta: 2e+20, init: 6.0e+21}
