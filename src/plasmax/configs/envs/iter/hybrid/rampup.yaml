# ITER hybrid — ramp-up phase.
#
# The episode ends as soon as the current reaches the flat-top value — no
# flat-top hold, no ramp-down. The plasma starts cold and only the 0–100 s Ip
# ramp (3 → 10.5 MA) is simulated. Isolates the cold-start ramp-up as its own
# control problem, side-by-side with flattop (stationary) and rampdown
# (terminal).
#
# Geometry:  Per-Ip FreeGSnke EQDSKs (3 / 4.5 / 10.5 MA).
# The reset state and sources retain the calibrated TORAX v1.4.2 reference,
# while the control task uses the original 100 s horizon and the shared ITER
# fixed_dt = 0.1 s -> 1000 steps.

phase: rampup
reset_reference: iter_hybrid_cold_v1_4_2

initialization: ${DATA_DIR}/initializations/iter/hybrid/cold.yaml

task:
  reward: lh_transition
  terminal_penalty: -100

torax:
  profile_conditions:
    Ip: {0: 3.0e+6, 100: 10.5e+6}
    T_i_right_bc: 0.1
    T_e_right_bc: 0.1
    n_e_right_bc: {0: 0.1, 100: 0.3}
    n_e_right_bc_is_fGW: true
  numerics:
    t_final: 100.0               # full ramp-up control horizon [s] -> 1000 steps
  geometry:
    geometry_configs:
      0.0: {geometry_file: iter_hybrid_ip030.eqdsk}
      20.0: {geometry_file: iter_hybrid_ip045.eqdsk}
      100.0: {geometry_file: iter_hybrid_ip105.eqdsk}
  sources:
    generic_current:
      fraction_of_total_current: 0.15
    generic_particle:
      S_total: 0.0
    generic_heat:
      gaussian_location: 0.12741589640723575
      gaussian_width: 0.07280908366127758
      P_total: 20000000.0
      electron_heat_fraction: 1.0
    ecrh:
      P_total: 0.0
    gas_puff:
      S_total: 0.0
  pedestal:
    T_i_ped: 1.0
    T_e_ped: 1.0
    n_e_ped: {0: 0.3, 100: 0.7}
    n_e_ped_is_fGW: true
    rho_norm_ped_top: 0.9
actuators:
- {name: P_nbi, low: 0.0, high: 50000000.0, max_delta: 2000000.0, init: 20000000.0}
- {name: P_eccd, low: 0.0, high: 50000000.0, max_delta: 2000000.0, init: 0.0}
- {name: rho_eccd, low: 0.0, high: 0.8, max_delta: 0.05, init: 0.12741589640723575}
- {name: gas_puff_rate, low: 0.0, high: 1e+22, max_delta: 2e+20, init: 0.0}
