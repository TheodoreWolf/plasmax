# ITER advanced (steady-state) scenario — phase-shared physical reference.
#
# Target: ~9 MA fully non-inductive steady-state with weak/reversed shear and an
# internal transport barrier (ITB) — the most speculative ITER scenario for
# current TORAX. Physics common to all three advanced phases; each phase file
# overlays its deltas. Device-level config is inherited from
# tokamaks/iter.yaml via `tokamak: iter`.
#
# The hot kinetic and q profiles are digitized from page 25 of the official
# ITER Physics summer-school deck. Psi is reconstructed deterministically from
# q and normalized to the local 9 MA equilibrium edge flux. This reference is
# illustrative/medium-confidence, exactly as labelled by its source.

tokamak: iter
scenario: advanced

torax:
  plasma_composition:
    Z_eff: 1.8
  profile_conditions:
    n_e_right_bc_is_fGW: false
  sources:
    generic_particle:
      S_total: 2.05e+20
      deposition_location: 0.3
      particle_width: 0.25
    gas_puff:
      puff_decay_length: 0.3
      S_total: 6.0e+21
    generic_heat:
      gaussian_location: 0.3
      gaussian_width: 0.15
      P_total: 34.0e+6
      electron_heat_fraction: 0.4
    generic_current:               # NBI-CD, peaked off-axis for q-shear control
      gaussian_location: 0.45
      gaussian_width: 0.1
    ecrh:                          # broad off-axis ECCD, important for ITB
      gaussian_location: 0.5
      gaussian_width: 0.1
      P_total: 34.0e+6
      current_drive_efficiency: 0.3
    fusion: {}
    ei_exchange:
      Qei_multiplier: 1.0
  pedestal:
    T_i_ped: 1.651376
    T_e_ped: 2.201835
    n_e_ped: 5.733945e+19
    n_e_ped_is_fGW: false
    rho_norm_ped_top: 0.94
