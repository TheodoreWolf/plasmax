# ITER advanced (steady-state) scenario — phase-shared physical reference.
#
# Target: ~9 MA fully non-inductive steady-state with weak/reversed shear and an
# internal transport barrier (ITB) — the most speculative ITER scenario for
# current TORAX. Physics common to all three advanced phases; each phase file
# overlays its deltas. Device-level config is inherited from
# tokamaks/iter.yaml via `tokamak: iter`.
#
# The hot kinetic and q profiles are digitized from page 25 of the official
# ITER Physics summer-school deck. Psi is reconstructed deterministically from
# q and normalized to the local 9 MA equilibrium edge flux. This reference is
# illustrative/medium-confidence, exactly as labelled by its source.

