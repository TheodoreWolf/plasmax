# STEP SPP-001 EC-HD flat-top — public environment label: `step`.
#
# Defines the RL task around a fully non-inductive STEP flat-top. Pair with
# `bohm_gyrobohm.yaml` (the exact TORAX v1.4.2 STEP BgB exception lives below)
# or `tglfnn_spherical.yaml`. qlknn / cgm /
# conventional `tglfnn` is *not* valid for STEP — see
# plasmax.environment.merge._VALID_ENV_BACKEND_COMBOS.
#
# Device:    STEP prototype (compact, high-field, spherical tokamak).
#            Ip = 21.228640 MA initial (sustained, not pinned — see below).
# Initial state: T_e, T_i, n_e, psi, plasma composition and Z_eff are
#            loaded from the OpenSTEP IMAS data release (Brown, Casson
#            et al. 2025, DOI 10.14468/07jt-s540). The IMAS file is
#            vendored at ``data/STEP_SPP_001_ECHD_ftop.nc``
#            (~1.3 MB). This replaces ad-hoc parabolic profile guesses
#            that produced an initial state inconsistent with the
#            non-inductive steady state.
# Geometry:  IMAS equilibrium from the same file (n_rho = 25 sim grid).
# Current:   zero-loop-voltage LCFS BC (``use_v_loop_lcfs_boundary_condition``)
#            — fully non-inductive, sustained by bootstrap (~0.9) + ECCD.
#            Ip is the initial condition only.
# Sources:   ECCD (P_eccd, rho_eccd — Gaussian), pellet fuelling
#            (pellet_rate), ohmic, fusion, ei_exchange, impurity radiation.
# Episode:   t_final = 400 s, dt = 10 s -> 40 steps. Heavy impurity radiation,
#            very long current diffusion time (resistivity_multiplier = 10).
# Reference: Tholerus et al., Nucl. Fusion 2024 (10.1088/1741-4326/ad6ea2);
#            OpenSTEP data release (DOI 10.14468/07jt-s540);
#            TORAX step_flattop_bgb.py example.
#
# Device-level config (IMAS geometry plumbing, actuators, observations,
# disruption) is inherited from tokamaks/step.yaml.

task:
  reward: P_diff
  # Intentionally uncalibrated; STEP termination currently has no penalty.
  terminal_penalty: 0.0

tokamak: step
reset_reference: step_hot_openstep_v1_4_2

torax:
  # Pull T_e, T_i, n_e, psi, Ip, plasma composition, and Z_eff from the
  # OpenSTEP IDS. Any leaf set explicitly under profile_conditions /
  # plasma_composition below overrides on a per-key basis.
  _imas_init:
    # ${SCENARIO_DIR} resolves to this YAML's directory (envs/);
    # the IMAS data file lives at data/.
    path: ${SCENARIO_DIR}/../data/STEP_SPP_001_ECHD_ftop.nc
    profile_conditions: true
    plasma_composition: true
  plasma_composition:
    # The IMAS importer supplies measured n_impurity/n_e ratios for Xe, He and
    # Ar, but its default n_e_ratios mode ignores the released Z_eff profile.
    # Constrain the seeded Ar density with Z_eff while preserving the released
    # Xe and He ratios. Ar is chosen because the solved fraction stays
    # non-negative across the profile.
    impurity:
      impurity_mode: n_e_ratios_Z_eff
      species:
        Ar: null
  profile_conditions:
    # STEP SPP-001 is a fully non-inductive flat-top: zero LCFS loop voltage,
    # Ip sustained by bootstrap (~0.9) + ECCD. Ip from IMAS is the initial
    # condition; the v_loop=0 BC governs subsequent evolution.
    use_v_loop_lcfs_boundary_condition: true
    v_loop_lcfs: 0.0
  numerics:
    t_final: 400.0
    fixed_dt: 10.0
    resistivity_multiplier: 10.0
    min_rho_norm: 0.015
    evolve_ion_heat: true
    evolve_electron_heat: true
    evolve_current: true
    evolve_density: true
  geometry:
    imas_filepath: STEP_SPP_001_ECHD_ftop.nc
  sources:
    ohmic: {}
    fusion: {}
    ei_exchange: {}
    impurity_radiation:
      model_name: P_in_scaled_flat_profile
      fraction_P_heating: 0.7
    ecrh:
      # The released EC deposition is distributed. The controllable model is a
      # single Gaussian whose volume-weighted centroid and width match the
      # released profile; it is calibrated at the released 150 MW operating
      # point but is not a launcher-resolved replay.
      gaussian_location: 0.3384
      gaussian_width: 0.1704
      P_total: 150000000.0
      # Exact current-drive efficiency from TORAX v1.4.2.
      current_drive_efficiency: 0.14
    pellet:
      # Gaussian moment match to the released pellet deposition profile.
      pellet_deposition_location: 0.8
      pellet_width: 0.17
      S_total: 3.0e+21
  # Exact STEP Bohm-GyroBohm settings from TORAX v1.4.2. This is the one
  # preserved machine-specific BgB exception; it is validation-only during the
  # global conventional-backend calibration.
  transport:
    model_name: bohm-gyrobohm
    chi_e_bohm_multiplier: 0.15
    chi_i_bohm_multiplier: 0.15
    chi_e_gyrobohm_multiplier: 0.15
    chi_i_gyrobohm_multiplier: 0.15
    chi_e_bohm_coeff: 2.0e-6
    chi_e_gyrobohm_coeff: 2.5e-4
    chi_i_bohm_coeff: 2.0e-7
    chi_i_gyrobohm_coeff: 5.0e-6
    D_face_c1: 1.0
    D_face_c2: 0.3
    V_face_coeff: -0.1
    chi_min: 0.15
    chi_max: 100.0
    D_e_min: 1.0e-3
    D_e_max: 100.0
    V_e_min: -50.0
    V_e_max: 50.0
    smooth_everywhere: true
    smoothing_width: 0.05
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    # Values interpolated from the released profiles at rho_tor_norm = 0.95.
    mode: ADAPTIVE_SOURCE
    use_formation_model_with_adaptive_source: false
    rho_norm_ped_top: 0.95
    T_i_ped: 4.0
    T_e_ped: 5.0
    n_e_ped: 6.0e+19
actuators:
- {name: P_eccd, low: 50000000.0, high: 300000000.0, max_delta: 20000000.0, init: 150000000.0}
- {name: rho_eccd, low: 0.3, high: 0.7, max_delta: 0.05, init: 0.3384}
- {name: pellet_rate, low: 1e+20, high: 5e+22, max_delta: 5e+20, init: 3.0e+21}

# Preserve the released flat-top snapshot exactly at reset. Sensor degradation
# remains part of the `realistic` wrapper stack; physical-state perturbations
# are disabled for this reference-initialized environment.
state_noise:
  T_e: 0.0
  T_i: 0.0
  n_e: 0.0
