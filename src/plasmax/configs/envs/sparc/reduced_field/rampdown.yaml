# SPARC reduced-field — ramp-down phase. Hot start, drive Ip 5.7 -> 1 MA over
# 5 s while staying inside stability limits (pair with the `rampdown` reward).
phase: rampdown
reset_reference: sparc_h8_hot_figure16
initialization: ${DATA_DIR}/initializations/sparc/reduced_field/hot.yaml

task:
  reward: rampdown
  terminal_penalty: -462
torax:
  profile_conditions:
    Ip: {0: 5.7e+6, 5: 1.0e+6}
    T_i_right_bc: {0: 2.308, 5: 0.1}
    T_e_right_bc: {0: 2.53, 5: 0.1}
    n_e_right_bc: {0: 9.667e+19, 5: 1.0e+19}
  numerics:
    t_final: 5.0
  geometry:
    geometry_configs:
      0.0: {geometry_file: sparc_reduced_field_ip057.eqdsk}
      3.9: {geometry_file: sparc_reduced_field_ip020.eqdsk}   # Ip crosses 2 MA
      5.0: {geometry_file: sparc_reduced_field_ip010.eqdsk}   # limited end-of-discharge shape
  sources:
    generic_heat:
      P_total: 2.5e+7
    ecrh:
      P_total: 0.0
      gaussian_location: 0.3
    gas_puff:
      S_total: 0.0
actuators:
- {name: P_nbi, low: 0.0, high: 2.5e+7, max_delta: 2.0e+6, init: 2.5e+7}
- {name: P_eccd, low: 0.0, high: 1.0e+7, max_delta: 1.0e+6, init: 0.0}
- {name: rho_eccd, low: 0.2, high: 0.8, max_delta: 0.05, init: 0.3}
- {name: gas_puff_rate, low: 0.0, high: 1e+22, max_delta: 2e+20, init: 0.0}
