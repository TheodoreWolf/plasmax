# SPARC reduced-field H-mode ("H8") — phase-shared base.
# Early-operation scenario at 8 T / 5.7 MA (Ip lowered to hold q* at reduced
# field, lowering the L-H power threshold and MHD/disruption risk). The hot
# kinetic state is the pointwise median of the Figure 16 converged ensemble in
# Muraca et al. (2025), with its 10-90% envelope packaged for validation.
tokamak: sparc
scenario: reduced_field

stepping:
  max_event_substeps: 1

torax:
  plasma_composition:
    Z_eff: 1.5
  sources:
    generic_particle:
      S_total: 0.0
      deposition_location: 0.3
      particle_width: 0.25
    gas_puff:
      puff_decay_length: 0.3
      S_total: 0.0
    generic_heat:                  # ICRF aux heating (core-deposited)
      gaussian_location: 0.1
      gaussian_width: 0.2
      P_total: 25.0e+6
      electron_heat_fraction: 0.5
    generic_current:               # SPARC is mostly inductive — small, constant CD
      fraction_of_total_current: 0.1
      gaussian_location: 0.3
      gaussian_width: 0.1
    ecrh:
      gaussian_location: 0.3
      gaussian_width: 0.05
      P_total: 0.0
      current_drive_efficiency: 0.3
    fusion: {}
    ei_exchange:
      Qei_multiplier: 1.0
    # bremsstrahlung + Mavrin impurity_radiation are machine-wide: see
    # tokamaks/sparc.yaml. Z_eff (above) and the radiation_multiplier
    # randomization stay scenario-owned.
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    mode: ADAPTIVE_TRANSPORT
    formation_model:
      model_name: martin_scaling
    T_i_ped: 3.30769
    T_e_ped: 3.59467
    n_e_ped: 2.0e+20
    rho_norm_ped_top: 0.94
  # The short crash is an internal event; the environment then completes the
  # remainder of the physical control interval with the action held constant.
  mhd:
    sawtooth:
      trigger_model:
        model_name: simple
        s_critical: 0.1
        minimum_radius: 0.05
      redistribution_model:
        model_name: simple
        flattening_factor: 1.01
        mixing_radius_multiplier: 1.1
      crash_step_duration: 1.0e-5
