# SPARC reduced-field H-mode ("H8") — phase-shared base.
# Early-operation scenario at 8 T / 5.7 MA (Ip lowered to hold q* at reduced
# field, lowering the L-H power threshold and MHD/disruption risk). The hot
# kinetic state is the pointwise median of the Figure 16 converged ensemble in
# Muraca et al. (2025), with its 10-90% envelope packaged for validation.
tokamak: sparc
scenario: reduced_field

stepping:
  max_event_substeps: 1

torax:
  plasma_composition:
    Z_eff: 1.5
  profile_conditions:
    T_i:
      0.0: {0.02: 11.9231, 0.06: 11.8846, 0.1: 11.7692, 0.14: 11.3462, 0.18: 10.8462, 0.22: 10.1923, 0.26: 9.53846, 0.3: 8.94231, 0.34: 8.30769, 0.38: 7.65385, 0.42: 7.03846, 0.46: 6.5, 0.5: 6.0, 0.54: 5.61538, 0.58: 5.26923, 0.62: 5.0, 0.66: 4.73077, 0.7: 4.46154, 0.74: 4.23077, 0.78: 4.03846, 0.82: 3.84615, 0.86: 3.65385, 0.9: 3.5, 0.94: 3.30769, 0.98: 2.30769}
    T_e:
      0.0: {0.02: 13.9349, 0.06: 13.8018, 0.1: 13.2692, 0.14: 12.3373, 0.18: 11.4497, 0.22: 10.5621, 0.26: 9.80769, 0.3: 9.09763, 0.34: 8.38757, 0.38: 7.72189, 0.42: 7.10059, 0.46: 6.70118, 0.5: 6.34615, 0.54: 5.99112, 0.58: 5.68047, 0.62: 5.36982, 0.66: 5.05917, 0.7: 4.74852, 0.74: 4.52663, 0.78: 4.30473, 0.82: 4.08284, 0.86: 3.9497, 0.9: 3.77219, 0.94: 3.59467, 0.98: 2.52959}
    n_e:
      0.0: {0.02: 3.75e+20, 0.06: 3.71667e+20, 0.1: 3.65e+20, 0.14: 3.51667e+20, 0.18: 3.36667e+20, 0.22: 3.25e+20, 0.26: 3.1e+20, 0.3: 2.96667e+20, 0.34: 2.85e+20, 0.38: 2.75e+20, 0.42: 2.66667e+20, 0.46: 2.58333e+20, 0.5: 2.51667e+20, 0.54: 2.45e+20, 0.58: 2.38333e+20, 0.62: 2.33333e+20, 0.66: 2.3e+20, 0.7: 2.3e+20, 0.74: 2.28333e+20, 0.78: 2.25e+20, 0.82: 2.21667e+20, 0.86: 2.2e+20, 0.9: 2.18333e+20, 0.94: 2.0e+20, 0.98: 9.66667e+19}
    initial_psi_mode: geometry
    normalize_n_e_to_nbar: false
    n_e_nbar_is_fGW: false
  sources:
    generic_particle:
      S_total: 0.0
      deposition_location: 0.3
      particle_width: 0.25
    gas_puff:
      puff_decay_length: 0.3
      S_total: 0.0
    generic_heat:                  # ICRF aux heating (core-deposited)
      gaussian_location: 0.1
      gaussian_width: 0.2
      P_total: 25.0e+6
      electron_heat_fraction: 0.5
    generic_current:               # SPARC is mostly inductive — small, constant CD
      fraction_of_total_current: 0.1
      gaussian_location: 0.3
      gaussian_width: 0.1
    ecrh:
      gaussian_location: 0.3
      gaussian_width: 0.05
      P_total: 0.0
      current_drive_efficiency: 0.3
    fusion: {}
    ei_exchange:
      Qei_multiplier: 1.0
    # bremsstrahlung + Mavrin impurity_radiation are machine-wide: see
    # tokamaks/sparc.yaml. Z_eff (above) and the radiation_multiplier
    # randomization stay scenario-owned.
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    mode: ADAPTIVE_TRANSPORT
    formation_model:
      model_name: martin_scaling
    T_i_ped: 3.30769
    T_e_ped: 3.59467
    n_e_ped: 2.0e+20
    rho_norm_ped_top: 0.94
  # The short crash is an internal event; the environment then completes the
  # remainder of the physical control interval with the action held constant.
  mhd:
    sawtooth:
      trigger_model:
        model_name: simple
        s_critical: 0.1
        minimum_radius: 0.05
      redistribution_model:
        model_name: simple
        flattening_factor: 1.01
        mixing_radius_multiplier: 1.1
      crash_step_duration: 1.0e-5
