# Smoke-test scenario — minimal, fast, not physically meaningful.
#
# Device:    ITER-sized circular plasma (no equilibrium file required).
# Geometry:  built-in circular (R=6.2, a=2.0, B0=5.3), n_rho = 10.
# Transport: constant, chi_i = chi_e = 1.0 m^2/s.
# Sources:   NBI heating (P_nbi) + gas puff. No ECCD, no current drive,
#            no pedestal, no fusion-relevant tuning.
# Episode:   t_final = 0.5 s, dt = 0.1 s → 5 steps.
# Disruption: thresholds set far outside reachable values, so an episode
#            always runs to completion regardless of the policy.
# Use for:   pipeline sanity checks (reset/step, obs/action shapes,
#            wrappers, JIT trace, reward composition), CI smoke tests.
#            Do not use for real training.

task:
  reward: P_diff
  # Intentionally uncalibrated; this is a smoke-test fixture.
  terminal_penalty: 0.0

torax:
  plasma_composition:
    main_ion: {D: 0.5, T: 0.5}
    Z_eff: 1.6
  profile_conditions:
    Ip: 10.5e+6
    T_i:
      0.0: {0.0: 6.0, 1.0: 0.2}
    T_i_right_bc: 0.2
    T_e:
      0.0: {0.0: 6.0, 1.0: 0.2}
    T_e_right_bc: 0.2
    n_e_right_bc: 0.25e+20
    n_e_nbar_is_fGW: true
    normalize_n_e_to_nbar: true
    nbar: 0.8
    n_e:
      0: {0.0: 1.5, 1.0: 1.0}
  numerics:
    t_final: 0.5
    fixed_dt: 0.1
    resistivity_multiplier: 1
    evolve_ion_heat: true
    evolve_electron_heat: true
    evolve_current: true
    evolve_density: true
  geometry:
    geometry_type: circular
    n_rho: 10
    R_major: 6.2
    a_minor: 2.0
    B_0: 5.3
  neoclassical:
    bootstrap_current:
      bootstrap_multiplier: 1.0
  sources:
    generic_heat:
      gaussian_location: 0.3
      gaussian_width: 0.2
      P_total: 20.0e+6
      electron_heat_fraction: 0.5
    gas_puff:
      puff_decay_length: 0.3
      S_total: 1.0e+21
    fusion: {}
    ei_exchange:
      Qei_multiplier: 1.0
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: false
    # Keep the source-free mode explicit so enabling the pedestal later cannot
    # silently activate TORAX's adaptive-source default.
    mode: ADAPTIVE_TRANSPORT
  time_step_calculator:
    calculator_type: fixed

actuators:
  - {name: P_nbi,         low: 1.0e+6, high: 30.0e+6, max_delta: 2.0e+6}
  - {name: gas_puff_rate, low: 1.0e+20, high: 5.0e+21, max_delta: 2.0e+20}

observations:
  profiles:
    - {name: T_e, scale: 10.0,    bounds: [0.0, 30.0]}
    - {name: n_e, scale: 1.0e+20, bounds: [0.0, 2.0e+20]}
  scalars:
    - {name: W_thermal, scale: 1.0e+8, bounds: [0.0, 5.0e+8]}
    - {name: P_fusion,  scale: 1.0e+8, bounds: [0.0, 1.0e+9]}
    - {name: t,         scale: 1.0,    bounds: [0.0, 0.5]}
    - {name: q_min,     scale: 3.0,    bounds: [0.0, 10.0]}

# Disruption thresholds set well outside any plausible value so a smoke-test
# episode runs to completion regardless of dynamics. Tighten in real scenarios.
disruption:
  q_min_threshold: 0.01
  greenwald_threshold: 10.0
