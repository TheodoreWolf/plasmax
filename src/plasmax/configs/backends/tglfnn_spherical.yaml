# STEP spherical-tokamak backend — TGLFNN-UKAEA transport.
#
# Same cheap linear solver shape as tglfnn.yaml, but explicitly selects
# the STEP-trained TGLFNN weights. STEP physics and pedestal values are owned by
# the STEP tokamak/scenario layers.

extends: tglfnn_base.yaml

torax:
  transport:
    machine: step
  solver:
    solver_type: linear
