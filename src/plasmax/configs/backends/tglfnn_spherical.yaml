# STEP spherical-tokamak backend — TGLFNN-UKAEA transport.
#
# Same cheap linear solver shape as tglfnn.yaml, but explicitly selects
# the STEP-trained TGLFNN weights and carries the STEP pedestal values.

extends: tglfnn_base.yaml

physics_randomization:
  transport_model.collisionality_multiplier: { relative: [0.8, 1.2] }
  transport_model.chi_i_inner: { relative: [0.9, 1.1] }
  transport_model.chi_e_inner: { relative: [0.9, 1.1] }
  transport_model.D_e_inner: { relative: [0.9, 1.1] }
  transport_model.chi_i_outer: { relative: [0.9, 1.1] }
  transport_model.chi_e_outer: { relative: [0.9, 1.1] }
  transport_model.D_e_outer: { relative: [0.9, 1.1] }
  neoclassical.bootstrap_current.bootstrap_multiplier:
    { relative: [0.95, 1.05] }

torax:
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    rho_norm_ped_top: 0.95
    T_i_ped: 4.0
    T_e_ped: 5.0
    n_e_ped: 6.0e+19
  transport:
    machine: step
  solver:
    solver_type: linear
