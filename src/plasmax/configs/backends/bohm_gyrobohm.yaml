# Bohm-GyroBohm (BgB) transport backend — generic semi-empirical model.
#
# BgB is geometry-agnostic in TORAX. This backend carries the shared model,
# neoclassical, radiation, pedestal-model, and solver settings. Machine-specific
# calibration lives in the env — e.g. envs/step.yaml carries the
# OpenSTEP spherical-tokamak BgB coefficients + STEP pedestal on top of this
# matching backend.

physics_randomization:
  # BgB coefficients use a provisional +/-10% model-form prior.
  transport_model.chi_e_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_e_gyrobohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_gyrobohm_multiplier: {relative: [0.9, 1.1]}
  neoclassical.bootstrap_current.bootstrap_multiplier: {relative: [0.95, 1.05]}

torax:
  neoclassical:
    bootstrap_current:
      model_name: redl
    transport:
      model_name: angioni_sauter
      use_shaing_ion_correction: true
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    # The default ITER path retains Martin L-H/H-L formation without its stiff
    # adaptive-transport feedback; SPARC overrides this mode explicitly.
    mode: ADAPTIVE_SOURCE
    use_formation_model_with_adaptive_source: true
    formation_model:
      model_name: martin_scaling
  transport:
    model_name: bohm-gyrobohm
    chi_min: 0.15
    chi_max: 100.0
    smooth_everywhere: true
    smoothing_width: 0.05
  solver:
    solver_type: linear
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
  time_step_calculator:
    calculator_type: fixed
