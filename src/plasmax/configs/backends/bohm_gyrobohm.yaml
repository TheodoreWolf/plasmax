# Bohm-GyroBohm (BgB) transport backend — generic semi-empirical model.
#
# BgB is geometry-agnostic in TORAX. This backend carries only the turbulent
# transport model, its uncertainty, and the solver. Machine/common physics is
# supplied by the selected tokamak and scenario layers.

physics_randomization:
  # BgB coefficients use a provisional +/-10% model-form prior.
  transport_model.chi_e_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_e_gyrobohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_gyrobohm_multiplier: {relative: [0.9, 1.1]}

torax:
  transport:
    model_name: bohm-gyrobohm
    chi_min: 0.15
    chi_max: 100.0
    smooth_everywhere: true
    smoothing_width: 0.05
  solver:
    solver_type: linear
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
