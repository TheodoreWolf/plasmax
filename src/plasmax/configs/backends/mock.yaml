# Mock backend for the circular smoke environment.
#
# Constant transport and the small linear solve keep configuration and pipeline
# tests fast. This backend is not physically meaningful.

torax:
  transport:
    model_name: constant
    chi_i: 1.0
    chi_e: 1.0
    D_e: 0.1
    V_e: 0.0
  solver:
    solver_type: linear
    use_predictor_corrector: true
    n_corrector_steps: 1
    use_pereverzev: true
    chi_pereverzev: 30
    D_pereverzev: 15
