# Shared TGLFNN-UKAEA transport, uncertainty, and linear-solver defaults.
#
# Concrete backends select the trained machine weights and solver implementation.
# Common machine physics comes from the tokamak/scenario layers. This fragment
# is internal and is not a backend registry entry.

physics_randomization:
  transport_model.collisionality_multiplier: {relative: [0.8, 1.2]}
  transport_model.chi_i_inner: {relative: [0.9, 1.1]}
  transport_model.chi_e_inner: {relative: [0.9, 1.1]}
  transport_model.D_e_inner: {relative: [0.9, 1.1]}
  transport_model.chi_i_outer: {relative: [0.9, 1.1]}
  transport_model.chi_e_outer: {relative: [0.9, 1.1]}
  transport_model.D_e_outer: {relative: [0.9, 1.1]}

torax:
  transport:
    model_name: tglfnn-ukaea
    # Rotation/momentum transport is not modelled in these scenarios.
    use_rotation: false
    rotation_multiplier: 1.0
    collisionality_multiplier: 1.0
    DV_effective: true
    An_min: 0.05

    # Hard bounds for out-of-distribution NN predictions.
    chi_min: 0.05
    chi_max: 100.0
    D_e_min: 0.05
    D_e_max: 50.0
    V_e_min: -10.0
    V_e_max: 10.0
    smoothing_width: 0.1

    # Inner-core surrogate OOD guard and outer L-mode shoulder patch. The inner
    # patch is not a sawtooth crash/redistribution model.
    apply_inner_patch: true
    chi_i_inner: 1.0
    chi_e_inner: 1.0
    D_e_inner: 0.25
    V_e_inner: 0.0
    rho_inner: 0.2
    apply_outer_patch: true
    chi_i_outer: 2.0
    chi_e_outer: 2.0
    D_e_outer: 0.1
    V_e_outer: 0.0
    rho_outer: 0.9
  solver:
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
