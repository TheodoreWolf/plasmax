# STEP Bohm-GyroBohm backend — OpenSTEP-calibrated semi-empirical transport.
#
# This is the complete STEP-specific counterpart to bohm_gyrobohm.yaml. It
# carries the same model-form uncertainty and linear solver while preserving
# the exact TORAX v1.4.2 STEP transport calibration.

physics_randomization:
  # BgB coefficients use a provisional +/-10% model-form prior.
  transport_model.chi_e_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_bohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_e_gyrobohm_multiplier: {relative: [0.9, 1.1]}
  transport_model.chi_i_gyrobohm_multiplier: {relative: [0.9, 1.1]}

torax:
  transport:
    model_name: bohm-gyrobohm
    chi_e_bohm_multiplier: 0.15
    chi_i_bohm_multiplier: 0.15
    chi_e_gyrobohm_multiplier: 0.15
    chi_i_gyrobohm_multiplier: 0.15
    chi_e_bohm_coeff: 2.0e-6
    chi_e_gyrobohm_coeff: 2.5e-4
    chi_i_bohm_coeff: 2.0e-7
    chi_i_gyrobohm_coeff: 5.0e-6
    D_face_c1: 1.0
    D_face_c2: 0.3
    V_face_coeff: -0.1
    chi_min: 0.15
    chi_max: 100.0
    D_e_min: 1.0e-3
    D_e_max: 100.0
    V_e_min: -50.0
    V_e_max: 50.0
    smooth_everywhere: true
    smoothing_width: 0.05
  solver:
    solver_type: linear
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
