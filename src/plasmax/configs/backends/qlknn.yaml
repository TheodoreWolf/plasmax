# QLKNN transport with the fixed-cost linear theta-method solver.

physics_randomization:
  # QLKNN validation errors are O(10%); fixed patches use provisional
  # +/-10% priors.
  transport_model.collisionality_multiplier: {relative: [0.85, 1.15]}
  transport_model.chi_i_inner: {relative: [0.9, 1.1]}
  transport_model.chi_e_inner: {relative: [0.9, 1.1]}
  transport_model.D_e_inner: {relative: [0.9, 1.1]}
  transport_model.chi_i_outer: {relative: [0.9, 1.1]}
  transport_model.chi_e_outer: {relative: [0.9, 1.1]}
  transport_model.D_e_outer: {relative: [0.9, 1.1]}

torax:
  transport:
    model_name: qlknn
    include_ITG: true
    include_TEM: true
    include_ETG: true
    ITG_flux_ratio_correction: 1.0

    # Stability margins and hard bounds for out-of-distribution predictions.
    avoid_big_negative_s: true
    smag_alpha_correction: true
    # Keep off while the physical sawtooth model is paused: this QLKNN-only input
    # clamp is not a crash/redistribution model and would make q=1 treatment
    # backend-specific.
    q_sawtooth_proxy: false
    DV_effective: true
    An_min: 0.05
    chi_min: 0.05
    chi_max: 100.0
    D_e_min: 0.05
    D_e_max: 50.0
    V_e_min: -10.0
    V_e_max: 10.0
    smoothing_width: 0.1

    # Inner-core surrogate OOD guard and outer L-mode shoulder patch. The inner
    # patch is not a sawtooth crash/redistribution model.
    apply_inner_patch: true
    chi_i_inner: 1.0
    chi_e_inner: 1.0
    D_e_inner: 0.25
    V_e_inner: 0.0
    rho_inner: 0.2
    apply_outer_patch: true
    chi_i_outer: 2.0
    chi_e_outer: 2.0
    D_e_outer: 0.1
    V_e_outer: 0.0
    rho_outer: 0.9
  solver:
    solver_type: linear
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
