# Legacy benchmark-local TGLFNN Newton-Raphson reference. New runs should use
# the packaged `tglfnn_nr` backend. The relaxed line-search floor and
# 100-iteration cap are needed for the ITER hybrid flat-top trajectory.

torax:
  pedestal:
    model_name: set_T_ped_n_ped
    set_pedestal: true
    mode: ADAPTIVE_TRANSPORT
    formation_model:
      model_name: martin_scaling
  numerics:
    max_dt: 0.5
    chi_timestep_prefactor: 50
    dt_reduction_factor: 3
  neoclassical:
    bootstrap_current:
      model_name: redl
    transport:
      model_name: angioni_sauter
      use_shaing_ion_correction: true
  transport:
    model_name: tglfnn-ukaea
    machine: multimachine
    use_rotation: false
    rotation_multiplier: 1.0
    collisionality_multiplier: 1.0
    DV_effective: true
    An_min: 0.05
    chi_min: 0.05
    chi_max: 100.0
    D_e_min: 0.05
    D_e_max: 50.0
    V_e_min: -10.0
    V_e_max: 10.0
    smoothing_width: 0.1
    apply_inner_patch: true
    chi_i_inner: 1.0
    chi_e_inner: 1.0
    D_e_inner: 0.25
    V_e_inner: 0.0
    rho_inner: 0.2
    apply_outer_patch: true
    chi_i_outer: 2.0
    chi_e_outer: 2.0
    D_e_outer: 0.1
    V_e_outer: 0.0
    rho_outer: 0.9
  solver:
    solver_type: newton_raphson
    use_predictor_corrector: true
    n_corrector_steps: 10
    chi_pereverzev: 30
    D_pereverzev: 15
    use_pereverzev: true
    log_iterations: false
    n_max_iterations: 100
    tau_min: 1.0e-6
  time_step_calculator:
    calculator_type: fixed
